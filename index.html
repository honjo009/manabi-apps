<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>カド番からの出口</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    background: #FFDD00;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 0 20px 70px;
  }

  .hero {
    padding: 56px 4px 30px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #0A0A0A;
    opacity: 0.6;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    line-height: 1.15;
    color: #0A0A0A;
    letter-spacing: 0.01em;
  }

  h1 .big {
    font-size: 46px;
    font-weight: 900;
  }

  h1 .tiny {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.06em;
    margin: 0 1px;
    vertical-align: middle;
  }

  h1 .quarter {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }

  h1 .kado {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }

  .hero-sub {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
    color: #0A0A0A;
    opacity: 0.65;
    letter-spacing: 0.02em;
    text-align: right;
  }

  .subject {
    margin-bottom: 30px;
  }

  .subject-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .subject-title {
    font-size: 13px;
    font-weight: 700;
    color: #0A0A0A;
    opacity: 0.7;
    letter-spacing: 0.04em;
  }

  .app-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  a.app-card, .app-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFFDF3;
    border: 2px solid #0A0A0A;
    border-radius: 12px;
    padding: 8px 16px;
    text-decoration: none;
    color: #0A0A0A;
    box-shadow: 0 2px 0 rgba(10, 10, 10, 0.15);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  a.app-card:active {
    transform: scale(0.98);
    box-shadow: none;
  }

  .app-name {
    font-size: 14.5px;
    font-weight: 700;
  }

  .app-arrow {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #0A0A0A;
    color: #FFDD00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .app-card.disabled {
    background: rgba(10, 10, 10, 0.04);
    border-color: rgba(10, 10, 10, 0.25);
    color: rgba(10, 10, 10, 0.4);
    box-shadow: none;
    pointer-events: none;
  }

  .app-card.disabled .app-arrow {
    background: rgba(10, 10, 10, 0.15);
    color: rgba(10, 10, 10, 0.35);
  }

  .badge-soon {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    background: rgba(10, 10, 10, 0.08);
    color: rgba(10, 10, 10, 0.5);
    border-radius: 20px;
    padding: 2px 9px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <h1><span class="kado">カド</span><span class="big">番</span><span class="tiny">からの</span><span class="big">出口</span> <span class="big">4</span> <span class="quarter">Exit</span></h1>
    <div class="hero-sub">凡ミスを見逃すな</div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">地理</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="geography/chiri-quiz/">
        <span class="app-name">クイズ地理オネア</span>
        <span class="app-arrow">→</span>
      </a>
      <a class="app-card" href="geography/boueki-quiz/">
        <span class="app-name">貿易グラフ道場</span>
        <span class="app-arrow">→</span>
      </a>
      <div class="app-card disabled">
        <span class="app-name">距離マップ<span class="badge-soon">準備中</span></span>
        <span class="app-arrow">→</span>
      </div>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">歴史</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="history/rekishi-quiz/">
        <span class="app-name">歴史クイズ</span>
        <span class="app-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">地学</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="science/ido-keido-globe/">
        <span class="app-name">緯度経度シミュレーター</span>
        <span class="app-arrow">→</span>
      </a>
      <a class="app-card" href="science/zensen/">
        <span class="app-name">気圧・天気のしくみ</span>
        <span class="app-arrow">→</span>
      </a>
      <a class="app-card" href="science/chikyugi-time-machine/">
        <span class="app-name">地球儀タイムマシン</span>
        <span class="app-arrow">→</span>
      </a>
      <a class="app-card" href="science/moon-phase-lab/">
        <span class="app-name">月の満ち欠け</span>
        <span class="app-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">生物</span>
    </div>
    <div class="app-list">
      <div class="app-card disabled">
        <span class="app-name">準備中</span>
        <span class="app-arrow">→</span>
      </div>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">化学</span>
    </div>
    <div class="app-list">
      <div class="app-card disabled">
        <span class="app-name">準備中</span>
        <span class="app-arrow">→</span>
      </div>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">物理</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="science/teko/">
        <span class="app-name">てこのしくみ</span>
        <span class="app-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">国語</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="japanese/hinshi-drill/">
        <span class="app-name">瀕死の品詞</span>
        <span class="app-arrow">→</span>
      </a>
    </div>
  </div>

  <div class="subject">
    <div class="subject-head">
      <span class="subject-title">算数</span>
    </div>
    <div class="app-list">
      <a class="app-card" href="math/tokei-zan-lab/">
        <span class="app-name">時計算ラボ</span>
        <span class="app-arrow">→</span>
      </a>
      <div class="app-card disabled">
        <span class="app-name">算数カルテ<span class="badge-soon">準備中</span></span>
        <span class="app-arrow">→</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
