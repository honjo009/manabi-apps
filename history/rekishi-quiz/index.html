const STORAGE_KEY = "history_jomon_proto:album:v2";
// 指定した時代でまだ埋まっていない通常カードを返す
function getEraLockedCards(albumProgress, era) {
    const state = albumProgress[era.id] || { unlockedCardIds: [], specialUnlocked: false };
    return era.cards.filter((c) => !state.unlockedCardIds.includes(c.id));
}
// 指定した時代の通常カードがすべて埋まっているか
function isEraComplete(albumProgress, era) {
    const state = albumProgress[era.id] || { unlockedCardIds: [], specialUnlocked: false };
    return state.unlockedCardIds.length >= era.cards.length;
}
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function buildInitialChapterSelection() {
    const map = {};
    CHAPTERS.forEach((c) => {
        map[c.id] = true; // デフォルトは全部オン
    });
    return map;
}
// 問題ID → 時代(章)ID の対応表(アルバムのご褒美をどの時代から出すか判定に使う)
const QUESTION_ERA_MAP = {};
CHAPTERS.forEach((c) => {
    c.questions.forEach((q) => {
        QUESTION_ERA_MAP[q.id] = c.id;
    });
});
const PROGRESS_KEY = "history_jomon_proto:progress";
// ============================================================
// 学習進捗エンジン(localStorage版)
// 正解/不正解の履歴を保存し、苦手な問題ほど優先的に出題されるようにする。
// GitHub/Vercelなど外部サーバーに置いてもそのまま動く(window.storageは
// Claude Artifacts専用のため、この用途にはlocalStorageを使う)。
// ============================================================
function loadProgress() {
    try {
        const raw = window.localStorage.getItem(PROGRESS_KEY);
        return raw ? JSON.parse(raw) : {};
    }
    catch (e) {
        return {};
    }
}
function saveProgress(progress) {
    try {
        window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    }
    catch (e) {
        // 保存に失敗しても学習自体は続行できるようにする
    }
}
function recordAnswer(progress, questionId, isCorrect) {
    const entry = progress[questionId] || { correct: 0, wrong: 0, mastered: false };
    const nextEntry = isCorrect
        ? { ...entry, correct: entry.correct + 1 }
        : { ...entry, wrong: entry.wrong + 1, mastered: false }; // 間違えたら「覚えた」判定は取り消す
    const next = { ...progress, [questionId]: nextEntry };
    saveProgress(next);
    return next;
}
// 「もう覚えた」チェックのオン/オフを記録する
function setMastered(progress, questionId, mastered) {
    const entry = progress[questionId] || { correct: 0, wrong: 0 };
    const next = { ...progress, [questionId]: { ...entry, mastered } };
    saveProgress(next);
    return next;
}
